name = "go-core"
version = "0.1.0"
languages = ["go"]

[[rule]]
id = "go-core.main"
main = { category = "application" }

[[rule]]
id = "go-core.tools"
path = { glob = "**/tools/**", category = "dev-tool" }

[[rule]]
id = "go-core.test-code"
test_code = { file_imports = ["testing", "github.com/stretchr/testify", "go.uber.org/mock", "github.com/golang/mock"], dir_names = ["test", "tests", "testutil", "testutils", "testdata", "testhelpers", "testing", "testsupport"] }

[[rule]]
id = "go-core.errors"
noise = { name_suffixes = ["Error"], methods = ["Error"] }

[[rule]]
id = "go-core.logging"
logging = { type_names = ["Logger", "SugaredLogger"], name_suffixes = ["Logger"] }
