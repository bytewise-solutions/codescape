name = "externals"
version = "0.1.0"

[[rule]]
id = "externals.postgres"
external_system = { file_imports = ["gorm.io/driver/postgres", "github.com/jackc/pgx", "github.com/lib/pq", "org.postgresql"], name = "PostgreSQL" }

[[rule]]
id = "externals.mongodb"
external_system = { file_imports = ["go.mongodb.org/mongo-driver", "com.mongodb", "org.mongodb"], name = "MongoDB" }

[[rule]]
id = "externals.mysql"
external_system = { file_imports = ["github.com/go-sql-driver/mysql", "gorm.io/driver/mysql", "com.mysql"], name = "MySQL" }

[[rule]]
id = "externals.redis"
external_system = { file_imports = ["github.com/redis/go-redis", "github.com/go-redis/redis", "redis.clients"], name = "Redis" }

[[rule]]
id = "externals.gcp-pubsub"
external_system = { file_imports = ["cloud.google.com/go/pubsub"], name = "GCP Pub/Sub" }

[[rule]]
id = "externals.aws-sns"
external_system = { file_imports = ["github.com/aws/aws-sdk-go-v2/service/sns"], name = "AWS SNS" }

[[rule]]
id = "externals.azure-eventgrid"
external_system = { file_imports = ["github.com/Azure/azure-sdk-for-go/sdk/messaging/eventgrid"], name = "Azure Event Grid" }

[[rule]]
id = "externals.smtp"
external_system = { file_imports = ["net/smtp", "github.com/emersion/go-smtp", "javax.mail", "jakarta.mail"], name = "Mail servers (SMTP)" }

[[rule]]
id = "externals.dns"
external_system = { file_imports = ["github.com/miekg/dns"], name = "DNS" }

[[rule]]
id = "externals.postgres-orm"
external_system = { file_imports = ["gorm.io/gorm", "github.com/jmoiron/sqlx", "database/sql"], name = "PostgreSQL", project_imports = ["gorm.io/driver/postgres", "github.com/jackc/pgx", "github.com/lib/pq"] }

[[rule]]
id = "externals.mysql-orm"
external_system = { file_imports = ["gorm.io/gorm", "github.com/jmoiron/sqlx", "database/sql"], name = "MySQL", project_imports = ["gorm.io/driver/mysql", "github.com/go-sql-driver/mysql"] }
