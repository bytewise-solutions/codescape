name = "java-core"
version = "0.1.0"
languages = ["java"]

[[rule]]
id = "java-core.main"
main = { category = "application" }

[[rule]]
id = "java-core.tools"
path = { glob = "**/tools/**", category = "dev-tool" }

[[rule]]
id = "java-core.tests"
path = { glob = "**/src/test/**", category = "test" }

[[rule]]
id = "java-core.test-code"
test_code = { file_imports = ["org.junit", "org.testng", "org.mockito", "org.assertj"], dir_names = ["test", "tests", "testutil", "testutils", "testfixtures"] }

[[rule]]
id = "java-core.exceptions"
noise = { name_suffixes = ["Exception"], supertype_suffixes = ["Exception", "Throwable", "java.lang.Error"] }

[[rule]]
id = "java-core.logging"
logging = { type_names = ["Logger", "LoggerFactory", "LogManager"], name_suffixes = ["Logger", "Logging"] }
