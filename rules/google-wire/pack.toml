name = "google-wire"
version = "0.1.0"
languages = ["go"]

[[rule]]
id = "google-wire.wiring"
wiring = { file_markers = ["Code generated by Wire", "//go:build wireinject"], file_imports = ["github.com/google/wire"], calls = ["wire.NewSet", "wire.Build", "wire.Bind", "wire.Struct", "wire.Value", "wire.InterfaceValue", "wire.FieldsOf"] }
